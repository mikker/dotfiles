[meta]
name = "Mekanikos"
direction = "Frosted Utility"
version = 1

[wide-gamut]
# More saturated than the sRGB fallback while retaining 6.7:1 contrast with
# white. CSS consumers opt in only when both syntax and a P3 output are present.
accent = "color(display-p3 0.04 0.30 0.84)"

[palette.dark]
mode = "dark"
accent = "#1853C7"
selection = "#3D4042"
muted = "#403833"
background = "#1C1917"
dark_background = "#171412"
darker_background = "#100E0D"
lighter_background = "#25211F"
foreground = "#B4BDC3"
dark_foreground = "#6E6763"
light_foreground = "#C4CACF"
bright_foreground = "#D4D9DC"
red = "#DE6E7C"
yellow = "#B77E64"
orange = "#D68C67"
green = "#819B69"
cyan = "#66A5AD"
blue = "#6099C0"
magenta = "#B279A7"
brown = "#867A74"
bright_red = "#E8838F"
bright_yellow = "#D68C67"
bright_green = "#8BAE68"
bright_cyan = "#65B8C1"
bright_blue = "#61ABDA"
bright_magenta = "#CF86C1"

[palette.light]
mode = "light"
accent = "#1853C7"
selection = "#CBD9E3"
muted = "#CFC1BA"
background = "#F0EDEC"
dark_background = "#E6E1DF"
darker_background = "#D8D1CE"
lighter_background = "#F7F5F4"
foreground = "#2C363C"
dark_foreground = "#6D7478"
light_foreground = "#4F5E68"
bright_foreground = "#182126"
red = "#A8334C"
yellow = "#944927"
orange = "#A85D2D"
green = "#4F6C31"
cyan = "#3B8992"
blue = "#286486"
magenta = "#88507D"
brown = "#76523A"
bright_red = "#94253E"
bright_yellow = "#803D1C"
bright_green = "#3F5A22"
bright_cyan = "#2B747C"
bright_blue = "#1D5573"
bright_magenta = "#7B3B70"

[color.dark]
canvas = "#1C1917"
surface-raised = "#25211F"
surface-solid = "#25211F"
surface-raised-alpha = 0.86
surface-alt = "#171412"
text-primary = "#B4BDC3"
text-secondary = "#8D9499"
text-muted = "#6E6763"
accent = "#1853C7"
focus = "#1853C7"
danger = "#DE6E7C"
success = "#819B69"
warning = "#D68C67"
info = "#66A5AD"
selection = "#3D4042"
border-solid = "#403833"
note-border = "#A1938C"
diff-add = "#A6B28B"
diff-delete = "#DCA3A3"

[color.light]
canvas = "#F0EDEC"
surface-raised = "#FFFFFF"
surface-solid = "#FCFBFA"
surface-raised-alpha = 0.78
surface-alt = "#F7F5F4"
text-primary = "#2C363C"
text-secondary = "#4F5E68"
text-muted = "#6D7478"
accent = "#1853C7"
focus = "#1853C7"
danger = "#A8334C"
success = "#4F6C31"
warning = "#A85D2D"
info = "#3B8992"
selection = "#CBD9E3"
border-solid = "#CFC1BA"
note-border = "#6A5549"
diff-add = "#5C6F3E"
diff-delete = "#A8334C"

[control.dark]
primary-background = "#1853C7"
primary-foreground = "#FFFFFF"
toggle-on-background = "#1853C7"
toggle-on-foreground = "#FFFFFF"
slider-fill = "#1853C7"
focus-ring = "#1853C7"
selected-fill-alpha = 0.22
hover-fill-alpha = 0.10

[control.light]
primary-background = "#1853C7"
primary-foreground = "#FFFFFF"
toggle-on-background = "#1853C7"
toggle-on-foreground = "#FFFFFF"
slider-fill = "#1853C7"
focus-ring = "#1853C7"
selected-fill-alpha = 0.14
hover-fill-alpha = 0.08

[chrome.dark]
bar-background-alpha = 0.72
overlay-background-alpha = 0.86
scrim-alpha = 0.20

[chrome.light]
bar-background-alpha = 0.64
overlay-background-alpha = 0.78
scrim-alpha = 0.12

[syntax.dark]
keyword = "#B4BDC3"
string = "#868C91"
comment = "#6E6763"
function = "#B4BDC3"
variable = "#979FA4"
type = "#A1938C"
number = "#868C91"
operator = "#8D9499"
punctuation = "#867A74"

[syntax.light]
keyword = "#2C363C"
string = "#556570"
comment = "#948985"
function = "#2C363C"
variable = "#44525B"
type = "#6A5549"
number = "#556570"
operator = "#4F5E68"
punctuation = "#8E817B"

[type]
ui = "Inter"
ui-strong = "Inter"
bar = "Inter Medium"
mono = "Iosevka Nerd Font Mono"
base-size = 14
size-small = 12
size-body = 14
size-title = 16
weight-normal = 400
weight-medium = 500
weight-strong = 650

[spacing]
unit = 2
scale = 1.0
scale-with-font = false
control-gap = 8
control-padding-x = 10
control-padding-y = 6
input-padding-y = 7
control-height = 28
popup-row-height = 28
row-gap = 6
row-padding-x = 10
label-gap = 4
popup-padding = 14
panel-padding = 14
panel-gap = 10
osd-padding-x = 20
osd-padding-y = 10

[radius]
small = 4
control = 8
surface = 14
full = 999

[border.subtle]
color = "#808080"
alpha = 0.28
width = 0.5

[border.glass]
color = "#FFFFFF"
alpha = 0.68
width = 1.0
inner-color = "#2C363C"
inner-alpha = 0.14
inner-width = 0.5

[border.glass-dark]
color = "#FFFFFF"
alpha = 0.22
width = 1.0
inner-color = "#FFFFFF"
inner-alpha = 0.08
inner-width = 0.5

[shadow.floating]
color = "#10131A"
alpha = 0.12
blur = 18
x = 0
y = 4

[shadow.low]
color = "#10131A"
alpha = 0.08
blur = 10
x = 0
y = 2

[blur]
floating = 18
tooltip = 12

[motion]
fast = 120
standard = 140
slow = 420
easing = "out-cubic"
theme-easing = "in-out-cubic"
