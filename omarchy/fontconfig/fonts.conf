<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Iosevka Nerd Font Mono</string>
    </edit>
  </match>

  <!--
    "Inter Medium Tabular": the shell bar's font (White Pill Studio
    type.bar). Omarchy's bar API accepts only a family string, so the alias
    selects Inter's Medium face and asks for tabular numerals (tnum).

    Qt (quickshell) resolves a family only from names that fonts carry, not
    through pattern substitution, so the scan rule adds the alias as a
    subfamily name (style "Regular") of the upright Inter Medium face. It is
    applied when fonts are cached: run `fc-cache -f` after editing this file
    or after a root `fc-cache` rebuilds /var/cache/fontconfig.
  -->
  <match target="scan">
    <test name="family">
      <string>Inter</string>
    </test>
    <test name="weight">
      <const>medium</const>
    </test>
    <test name="slant">
      <const>roman</const>
    </test>
    <edit name="family" mode="append_last">
      <string>Inter Medium Tabular</string>
    </edit>
    <edit name="familylang" mode="append_last">
      <string>en</string>
    </edit>
    <edit name="style" mode="append_last">
      <string>Regular</string>
    </edit>
  </match>

  <!-- Pattern-level mapping for fontconfig clients (fc-match, Pango, …). -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>Inter Medium Tabular</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Inter</string>
    </edit>
    <edit name="weight" mode="assign" binding="strong">
      <const>medium</const>
    </edit>
    <edit name="fontfeatures" mode="append">
      <string>tnum</string>
    </edit>
  </match>
</fontconfig>
