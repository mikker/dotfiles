[settings]
clipboardHistoryRetention = 'oneYear'
clipboardIgnoredBundleIdentifiers = [ 'com.1password.1password', 'com.apple.keychainaccess' ]
comboModeCheatsheetBehavior = 'never'
comboModeCheatsheetShowDetails = false
comboModeDoublePressTrigger = 'rightOption'
comboModeModifierTrigger = 'rightCommand'
dictationActivationMode = 'toggle'
dictationWindowPosition = 'bottomLeft'
holdToExecuteEnabled = true
physicalHyperKeySource = 'capsLock'
screenPreference = 'primary'
shelfAutoCloseWhenTasksComplete = true
switchToTextModeWhenNoResults = true
talkModeModifierTrigger = 'rightOption'

