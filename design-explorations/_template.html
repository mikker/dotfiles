<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ TITLE }}</title>
  <style>
    :root {
      --brand-50: #edf3f7;
      --brand-100: #d9e6ee;
      --brand-500: #286486;
      --brand-700: #1d5573;
      --accent-500: #1853c7;
      --ink: #182126;
      --ink-soft: #4f5e68;
      --ink-mute: #6d7478;
      --line: rgba(44, 54, 60, .16);
      --line-soft: rgba(44, 54, 60, .08);
      --paper: #fcfbfa;
      --bg: #f0edec;
      --shadow-sm: 0 1px 2px rgba(24, 33, 38, .05), 0 4px 12px rgba(24, 33, 38, .04);
      --shadow-md: 0 2px 4px rgba(24, 33, 38, .05), 0 18px 48px -18px rgba(24, 33, 38, .18);
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "Iosevka Nerd Font Mono", "SFMono-Regular", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
    .page { width: min(1320px, calc(100% - 40px)); margin: 0 auto; padding: 64px 0 120px; }
    .doc-header { max-width: 820px; padding-bottom: 36px; border-bottom: .5px solid var(--line); margin-bottom: 72px; }
    .doc-kicker { color: var(--brand-700); font: 600 12px/1.2 var(--mono); margin-bottom: 16px; }
    .doc-title { font-size: clamp(38px, 6vw, 64px); line-height: 1.02; letter-spacing: -.045em; font-weight: 620; margin: 0 0 18px; }
    .doc-subtitle { color: var(--ink-soft); font-size: 18px; max-width: 720px; margin: 0 0 26px; }
    .doc-meta { display: flex; flex-wrap: wrap; gap: 10px 24px; color: var(--ink-mute); font: 12px/1.4 var(--mono); }
    .variant { margin-bottom: 92px; }
    .variant-head { display: grid; grid-template-columns: 48px 1fr; gap: 16px; margin-bottom: 24px; }
    .variant-letter { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: white; font: 600 15px/1 var(--mono); }
    .variant h2 { margin: 0 0 4px; font-size: 25px; letter-spacing: -.025em; }
    .variant-tradeoff { margin: 0; color: var(--ink-soft); }
    .variant-tradeoff b { color: var(--brand-700); font-weight: 600; }
    .preview-frame { margin-left: 64px; overflow: hidden; border: .5px solid var(--line); border-radius: 16px; background: var(--paper); box-shadow: var(--shadow-md); }
    .preview-frame-bar { padding: 10px 14px; border-bottom: .5px solid var(--line-soft); color: var(--ink-mute); background: rgba(255,255,255,.5); font: 11px/1.3 var(--mono); }
    .preview { min-height: 260px; }
    .variant-analysis { margin: 20px 0 0 64px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .analysis-block { background: rgba(252,251,250,.72); border: .5px solid var(--line); border-radius: 10px; padding: 16px; }
    .analysis-block h4 { margin: 0 0 6px; color: var(--brand-700); font: 600 11px/1.2 var(--mono); }
    .analysis-block p { margin: 0; color: var(--ink-soft); font-size: 13px; }
    .decision { margin: 112px 0 0 64px; padding: 32px; color: white; background: var(--ink); border-radius: 16px; box-shadow: var(--shadow-md); }
    .decision h3 { margin: 0 0 6px; font-size: 25px; }
    .decision > p { margin: 0 0 22px; color: rgba(255,255,255,.68); }
    .decision-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .decision-cell b { display: block; color: #d9e6ee; font: 600 11px/1.3 var(--mono); margin-bottom: 5px; }
    .decision-cell span { color: rgba(255,255,255,.86); font-size: 13px; }
    @media (max-width: 800px) {
      .page { padding-top: 36px; }
      .preview-frame, .variant-analysis, .decision { margin-left: 0; }
      .variant-analysis, .decision-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="doc-header">
      <div class="doc-kicker">Design exploration</div>
      <h1 class="doc-title">{{ TITLE }}</h1>
      <p class="doc-subtitle">{{ SUBTITLE }}</p>
      <div class="doc-meta"><span>{{ SPEC_PATH }}</span><span>{{ DATE }}</span><span>4 directions</span></div>
    </header>
    {{ VARIANTS }}
    {{ DECISION }}
  </main>
</body>
</html>
